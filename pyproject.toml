[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goti"
version = "0.1.0"
description = "GPU-optimized transformer inference research harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ben Karlsberg" }]
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.30",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "pandas>=2.0",
  "tqdm>=4.66",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.2", "ruff>=0.5"]
quant = ["bitsandbytes>=0.43; platform_system=='Linux'"]

[project.scripts]
goti-env = "goti.cli:record_env_main"
goti-run = "goti.cli:run_experiment_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
  "gpu: tests that require CUDA",
  "slow: longer benchmarks",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
